# Builds and tests the Linux desktop port (desktop/) and renders each screen to a picture.
# The results (status, logs, test reports, screenshots) are force-pushed to the desktop-ci branch,
# so they can be read with plain git.
name: Desktop

on:
  push:
    branches: [linux-desktop]
    paths: ['desktop/**', 'providers/**', 'gradle/**', 'app/src/main/res/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install mpv
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mpv
      - name: Compile
        id: compile
        run: |
          mkdir -p out
          set -o pipefail
          ./gradlew -p desktop compileKotlin compileTestKotlin --console=plain 2>&1 | tee out/compile.log
      - name: Test and render screens
        id: test
        continue-on-error: true
        env:
          MOCHY_SHOTS: ${{ github.workspace }}/out/shots
        run: |
          set -o pipefail
          ./gradlew -p desktop test --console=plain --continue 2>&1 | tee out/test.log
      - name: Publish results to desktop-ci
        if: always()
        run: |
          cp -r desktop/build/test-results out/test-results 2>/dev/null || true
          printf 'commit %s\ncompile %s\ntest %s\n' "${{ github.sha }}" "${{ steps.compile.outcome }}" "${{ steps.test.outcome }}" > out/STATUS
          cd out
          git init -q -b desktop-ci
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -qm "CI for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" desktop-ci
      - name: Fail when the build or tests failed
        if: always() && (steps.compile.outcome != 'success' || steps.test.outcome != 'success')
        run: exit 1
